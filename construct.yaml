name: AlphaFold2
version: 0.0.1
environment_file: environment.yaml
installer_type: all
license_file: LICENSE
conclusion_text: Thank you! You have successfully installed AlphaFold2 0.0.1.
keep_pkgs: false
register_python: false
initialize_conda: false
extra_files:
- app/bash_bat_scripts/pre_uninstall.sh: pre_uninstall.sh
- app/bash_bat_scripts/uninstall.sh: uninstall.sh
- app/menuinst/Welcome.ipynb: AlphaFold2/notebooks/Welcome.ipynb
- app/menuinst/notebook_launcher.json: AlphaFold2/notebook_launcher.json
- app/python_scripts/hide_code_cells.py: AlphaFold2/hide_code_cells.py
- app/python_scripts/include_path.py: AlphaFold2/include_path.py
- app/python_scripts/launch_jupyter.py: AlphaFold2/launch_jupyter.py
- construct.yaml: AlphaFold2/construct.yaml
- notebooks/notebook_latest_versions.yaml: AlphaFold2/notebook_latest_versions.yaml
- requirements.txt: AlphaFold2/requirements.txt
- requirements_gpu.txt: AlphaFold2/requirements_gpu.txt
post_install: app/bash_bat_scripts/post_install.bat # [win]
post_install: app/bash_bat_scripts/post_install.sh # [unix]
pre_uninstall: app/bash_bat_scripts/pre_uninstall.bat # [win]
pre_uninstall: app/bash_bat_scripts/pre_uninstall.sh # [unix]
